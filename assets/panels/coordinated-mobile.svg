<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2311" viewBox="0 0 600 2311" role="img" aria-labelledby="title desc">
<title id="title">Coordinated outcomes</title>
<desc id="desc">Dify. CVE-2026-59210 RESERVED. Accepted; fix shipped since 1.16.0. CVE reserved; advisory publication pending. Apache DolphinScheduler. CVE-2026-57590, CVE-2026-66082 RESERVED. Two separately vendor-confirmed findings with reporter credit. Both CVEs are reserved; severity, remediation, and advisory details remain pending. Grafana.  ACCEPTED. CVE, remediation, and advisory coordination pending. ToolJet · separate report.  ACCEPTED. Accepted with reporter credit; CVE assignment, remediation, and advisory publication pending. authentik.  VALIDATED. Fix verification, CVE assignment, advisory publication, and public attribution pending. Five additional outcomes.  COORDINATED. Accepted or otherwise confirmed by their vendors. Product identities and technical details remain private during coordinated disclosure.</desc>
