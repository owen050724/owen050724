<title id="title">About the researcher</title>
<desc id="desc">I&#x27;m Yeonoh Park (박연오), a Computer Engineering undergraduate at Seoul National University of Science and Technology (SeoulTech) and an undergraduate researcher at the Cryptography Information Security Laboratory. I study how identity, authority, and trust move across software boundaries, and whether software enforces the security boundaries it is intended to provide. Interests: Vulnerability research; System security; Cryptography; Computer systems. Cryptography Information Security Laboratory: Undergraduate Researcher. TCP · Computer Science and Information Technology Club: Leader. STCE · SeoulTech Crypto Engine: Member.</desc>
