<desc id="desc">Gold Prize. Analysis of Privilege Transfer Vulnerabilities in Messenger-Based Local AI Agents. 메신저 기반 로컬 AI 에이전트의 권한 전이 취약점 분석. This work examines privilege transfer and authorization boundaries in messenger-based local AI agents. Authors: 박연오 · 최도현 · 김역 · 이창훈 · 손기욱†. 2026 Summer Conference of the Korea Digital Contents Society. Undergraduate Paper Competition. July 1–3, 2026. Conference proceedings and program book.</desc>
