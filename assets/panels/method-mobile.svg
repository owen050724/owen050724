<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1657" viewBox="0 0 600 1657" role="img" aria-labelledby="title desc">
<title id="title">How I work</title>
<desc id="desc">1. Model the boundary. Identify the identities, capabilities, data domains, and trust transitions that define a system&#x27;s expected security properties. 2. Follow authority. Trace how identity and scope propagate between components, looking for changes in how authority is interpreted. 3. Check the evidence. Use bounded local validation and competing explanations to distinguish a boundary failure from expected behavior. 4. Coordinate disclosure. Separate technical impact from reportability, account for prior work, document limitations, and work with vendors on disclosure.</desc>
